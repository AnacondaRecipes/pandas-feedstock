{% set name = "pandas" %}
{% set version = "3.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ecb9b2d8a817b1e1ba1fdb90c0abe9eab31b4fdf2562b7a56b86ac66ace17e49

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install -vv --no-deps --no-build-isolation --ignore-installed .

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - pip
    - python
    # meson[ninja] is referenced otherwise: meson-python: error: Could not find ninja version 1.8.2 or newer.
    - ninja-base >=1.8.2
    - meson-python >=0.19.0,<1
    - meson >=1.2.3,<2
    - cython >3.1.0,<4
    - numpy {{ numpy }}
    - versioneer
    - wheel
  run:
    - python
    - numpy >=2.0.2  # [py<314]
    - numpy >=2.3.3  # [py>=314]
    - python-dateutil >=2.9.0
    - python-tzdata   # [win]
  run_constrained:
    - adbc-driver-postgresql >=1.7.0
    - adbc-driver-sqlite >=1.7.0
    - beautifulsoup4 >=4.13.4
    - bottleneck >=1.5.0
    - fastparquet >=2024.11.0
    - fsspec >=2025.7.0
    - gcsfs >=2025.7.0
    - html5lib >=1.1
    - hypothesis >=6.116.0
    - jinja2 >=3.1.6
    - lxml >=6.0.0
    - matplotlib-base >=3.10.5
    - numba >=0.61.2
    - numexpr >=2.11.0,!=2.14.1
    - odfpy >=1.4.1
    - openpyxl >=3.1.5
    - psycopg2 >=2.9.10
    - pyarrow >=16.0.0
    - pyiceberg >=0.9.1
    - pymysql >=1.1.1
    # clipboard wants pyqt5 which we don't have
    - pyqt5 >=5.15.11
    - pyreadstat >=1.3.0
    - pytables >=3.10.2
    - pytest >=8.3.4
    - pytest-xdist >=3.6.1
    - python-calamine >=0.4.0
    - pytz >=2020.1
    - pyxlsb >=1.0.10
    - qtpy >=2.4.3
    - scipy >=1.16.1
    - s3fs >=2025.7.0
    - sqlalchemy >=2.0.42
    - tabulate >=0.9.0
    - xarray >=2025.7.1
    - xlrd >=2.0.2
    - xlsxwriter >=3.2.5
    - zstandard >=0.23.0

test:
  source_files:
    - pyproject.toml
  imports:
    - pandas.api
    - pandas.arrays
    - pandas.compat
    - pandas.core
    - pandas.errors
    - pandas.io
    - pandas.plotting
    - pandas.testing
    - pandas.tests
    - pandas.tseries
    - pandas.util
  requires:
    - pip
    - pytest >=8.3.4,<9.1
    - pytest-xdist >=3.6.1
  commands:
    - pip check
    - export LC_ALL=en_US.UTF-8  # [unix]
    {% set config_path = "{{ SRC_DIR }}/pyproject.toml" %}
    {% set markers = ["not clipboard", "not single_cpu", "not slow", "not network", "not db"] %}
    {% set extra_args = ["-m " + " and ".join(markers)] %}
    {% set extra_args = extra_args + ["-ra -v -n auto"] %}
    {% set tests_to_skip = "_not_a_real_test" %}
    # skip windows tests which call _tz_localize_using_tzinfo_api - fails on CI but not when run on dev instance
    # OSError may be thrown by tzlocal on windows at or close to 1970-01-01
    #  see https://github.com/pandas-dev/pandas/pull/37591#issuecomment-720628241
    {% set tests_to_skip = tests_to_skip + " or TestDatetime64ArrayLikeComparisons or test_apply_out_of_range or TestNonNano or test_setitem_str_impute_tz or test_run_binary[ne-False-_integer_integers]" %} # [win]
    # test_scalar_unary triggers python 3.12 DeprecationWarning: Bitwise inversion '~' on bool is deprecated.
    {% set tests_to_skip = tests_to_skip + " or test_scalar_unary" %} # [py>=312]
    # Could be due to uninitialized memory
    {% set tests_to_skip = tests_to_skip + " or test_run_arithmetic or test_run_binary" %} # [win]
    # macOS CI: dateutil London DST gap shifts differ by one hour; cause unconfirmed.
    {% set tests_to_skip = tests_to_skip + " or (test_dti_tz_localize_nonexistent_shift and dateutil/ and Europe/London and (backward or shift11))" %} # [osx]
    {% set extra_args = extra_args + ["-k", "not (" + tests_to_skip + ")", "--no-strict-data-files"] %}
    # use --no-strict-data-files
    # xref: https://github.com/pandas-dev/pandas/issues/54907
    - python -c "import pandas; pandas.test(extra_args={{ extra_args }})"

about:
  home: https://pandas.pydata.org
  license: BSD-3-Clause AND BSD-2-Clause AND MIT AND Apache-2.0 AND PSF-2.0 AND TCL
  license_family: OTHER
  license_file:
    - LICENSE
    - LICENSES/BOTTLENECK_LICENCE
    - LICENSES/DATEUTIL_LICENSE
    - LICENSES/HAVEN_LICENSE
    - LICENSES/HAVEN_MIT
    - LICENSES/KLIB_LICENSE
    - LICENSES/MUSL_LICENSE
    - LICENSES/NERI_SCHNEIDER_LICENSE
    - LICENSES/NUMPY_LICENSE
    - LICENSES/PACKAGING_LICENSE
    - LICENSES/PSF_LICENSE
    - LICENSES/PYPERCLIP_LICENSE
    - LICENSES/PYUPGRADE_LICENSE
    - LICENSES/SAS7BDAT_LICENSE
    - LICENSES/STATSBASE_JL_LICENSE
    - LICENSES/ULTRAJSON_LICENSE
    - LICENSES/XSIMD_LICENSE
    - subprojects/fast_float-8.2.10/LICENSE-APACHE
    - subprojects/fast_float-8.2.10/LICENSE-BOOST
    - subprojects/fast_float-8.2.10/LICENSE-MIT
  summary: High-performance, easy-to-use data structures and data analysis tools.
  description: |
    pandas is a Python package that provides fast, flexible, and expressive data structures
    designed to make working with "relational" or "labeled" data both easy and intuitive.
    It aims to be the fundamental high-level building block for doing practical, real world
    data analysis in Python. Additionally, it has the broader goal of becoming the most
    powerful and flexible open source data analysis / manipulation tool available in any
    language. It is already well on its way towards this goal.
  dev_url: https://github.com/pandas-dev/pandas
  doc_url: https://pandas.pydata.org/docs/

extra:
  recipe-maintainers:
    - jreback
    - jorisvandenbossche
